name: Deploy Box & Cross

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # DEPLOY TO AWS
      # ==========================================
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            echo "=========================================="
            echo "🚀 BOX & CROSS DEPLOYMENT STARTED"
            echo "=========================================="

            # ==========================================
            # PROJECT
            # ==========================================

            cd /var/www/boxcross

            echo "📥 Pulling latest code..."

            git fetch origin
            git reset --hard origin/main

            echo "✅ Latest code pulled"

            # ==========================================
            # BACKEND
            # ==========================================

            echo "=========================================="
            echo "🔧 BACKEND DEPLOYMENT"
            echo "=========================================="

            cd /var/www/boxcross/backend

            # Check backend environment
            if [ ! -f .env ]; then
              echo "❌ ERROR: backend/.env not found"
              exit 1
            fi

            echo "📦 Installing backend dependencies..."

            npm ci --omit=dev

            echo "✅ Backend dependencies installed"

            # ==========================================
            # PM2
            # ==========================================

            echo "🔄 Checking PM2 backend process..."

            if pm2 describe boxcross-backend > /dev/null 2>&1; then

              echo "♻️ Restarting existing backend..."

              pm2 restart boxcross-backend --update-env

            else

              echo "🆕 Starting backend..."

              pm2 start server.js \
                --name boxcross-backend \
                --update-env

            fi

            # Save PM2 process list
            pm2 save

            echo "⏳ Waiting for backend..."

            sleep 5

            # ==========================================
            # PM2 HEALTH CHECK
            # ==========================================

            echo "🔍 Checking PM2 status..."

            pm2 status

            if ! pm2 describe boxcross-backend | grep -q "online"; then

              echo "❌ Backend process is NOT online"

              pm2 logs boxcross-backend \
                --lines 50 \
                --nostream

              exit 1

            fi

            echo "✅ Backend process is online"

            # ==========================================
            # API HEALTH CHECK
            # ==========================================

            echo "🔍 Checking backend API..."

            if ! curl -fsS \
              --max-time 10 \
              http://127.0.0.1:5000/ \
              > /dev/null; then

              echo "❌ Backend API health check FAILED"

              pm2 logs boxcross-backend \
                --lines 50 \
                --nostream

              exit 1

            fi

            echo "✅ Backend API is healthy"

            # ==========================================
            # FRONTEND
            # ==========================================

            echo "=========================================="
            echo "🎨 FRONTEND DEPLOYMENT"
            echo "=========================================="

            cd /var/www/boxcross/frontend

            echo "📦 Installing frontend dependencies..."

            npm ci

            echo "🏗️ Building frontend..."

            npm run build

            # ==========================================
            # FRONTEND BUILD CHECK
            # ==========================================

            if [ ! -f dist/index.html ]; then

              echo "❌ ERROR: Frontend build failed"
              echo "dist/index.html not found"

              exit 1

            fi

            echo "✅ Frontend build completed"

            # ==========================================
            # NGINX
            # ==========================================

            echo "=========================================="
            echo "🌐 NGINX DEPLOYMENT"
            echo "=========================================="

            echo "🔍 Testing Nginx configuration..."

            sudo nginx -t

            echo "🔄 Reloading Nginx..."

            sudo systemctl reload nginx

            echo "✅ Nginx reloaded"

            # ==========================================
            # FRONTEND HEALTH CHECK
            # ==========================================

            echo "🔍 Checking frontend..."

            if ! curl -fsS \
              --max-time 10 \
              http://127.0.0.1/ \
              -H "Host: membership.boxandcross.com" \
              > /dev/null; then

              echo "❌ Frontend health check FAILED"

              exit 1

            fi

            echo "✅ Frontend is healthy"

            # ==========================================
            # FINAL
            # ==========================================

            echo "=========================================="
            echo "🎉 DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo "Frontend:"
            echo "https://membership.boxandcross.com"

            echo "Backend:"
            echo "https://api.boxandcross.com"

            echo "=========================================="